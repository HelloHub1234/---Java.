name: build-clicker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        # Имя репозитория заканчивается точкой, а Windows не может создать путь
        # вида D:\a\---Java.\---Java.: точка в конце имени папки отбрасывается.
        # Поэтому работаем из явного каталога без завершающей точки.
        working-directory: C:\build

    steps:
      # actions/checkout разворачивает код в GITHUB_WORKSPACE, а путь
      # D:\a\---Java.\---Java. Windows создать не может (точка в конце имени папки),
      # поэтому клонируем вручную в каталог без завершающей точки.
      - name: Checkout
        shell: pwsh
        working-directory: C:\
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'C:\build'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          git init --quiet $dir
          git -C $dir remote add origin "https://github.com/${{ github.repository }}.git"
          git -C $dir fetch --depth 1 origin "${{ github.ref }}"
          git -C $dir checkout --quiet FETCH_HEAD
          git -C $dir log --oneline -1

      # Упаковка апп-образа требует JDK 17+; 21 совпадает с локальной сборкой.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: none

      - name: Compile sources
        run: |
          New-Item -ItemType Directory -Force -Path classes | Out-Null
          # Перечисляем все исходники пакета: javac не подхватывает Theme/Text/ProgressStorage автоматически
          javac -encoding UTF-8 -d classes (Get-ChildItem src/WindowApps/*.java) (Get-ChildItem src/WindowApps/clicker/*.java -Recurse)
          # messages*.properties читаются через ResourceBundle, поэтому должны лежать в classpath
          Copy-Item src/WindowApps/messages*.properties classes/WindowApps/
          # Иконку во вторую jar-сборку тоже кладём: её видят инструменты, читающие архив
          Copy-Item assets/clicker.ico classes/WindowApps/clicker.ico

      - name: Build runnable jar
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          jar --create --file dist/clicker.jar --main-class WindowApps.clicker.Clicker -C classes WindowApps

      - name: Build app-image with bundled JRE
        run: |
          # --main-jar ищется внутри --input (classes), поэтому jar кладём туда
          Copy-Item dist/clicker.jar classes/clicker.jar
          # --icon задаёт значок и .exe, и app-image; .ico лежит в репозитории (см. tools/generate-icon.ps1)
          jpackage --type app-image --name Clicker --input classes --main-jar clicker.jar --main-class WindowApps.clicker.Clicker --icon assets/clicker.ico --dest dist/Clicker --java-options "-Dfile.encoding=UTF-8"
          Compress-Archive -Path dist/Clicker -DestinationPath dist/Clicker-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Clicker-windows
          # Пути абсолютные: GITHUB_WORKSPACE с точкой в конце имени не существует
          path: |
            C:\build\dist\Clicker-windows.zip
            C:\build\dist\clicker.jar
          if-no-files-found: error

      - name: Attach artifacts to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Кликер ${{ github.ref_name }}
          body: |
            Скачай и играй без установки Java:

            * **Clicker-windows.zip** — готовая сборка со встроенной Java. Распакуй и запусти `Clicker\Clicker.exe`.
            * **clicker.jar** — для тех, у кого уже установлена Java 17+: `java -jar clicker.jar`.

            Прогресс сохраняется автоматически в `%APPDATA%\Clicker`.
          files: |
            C:\build\dist\Clicker-windows.zip
            C:\build\dist\clicker.jar
